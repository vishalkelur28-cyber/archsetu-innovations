# Template only. Never commit real values.
#
# Applied with `kubectl create secret` (see README.md) rather than checked in,
# because SUPABASE_SERVICE_ROLE_KEY bypasses Postgres row-level security
# entirely - it is the highest-value credential the worker holds.
#
# Kubernetes Secrets are base64-encoded, NOT encrypted. Anyone with `get
# secret` in this namespace, and anyone who can read etcd, can read the value.
# For anything beyond a local kind cluster, back this with External Secrets
# Operator pointing at AWS Secrets Manager - the same store
# infra/terraform/aws/secrets.tf already provisions - so the value lives in
# one place with one audit trail.
apiVersion: v1
kind: Secret
metadata:
  name: archsetu-worker
  namespace: archsetu
type: Opaque
stringData:
  NEXT_PUBLIC_SUPABASE_URL: 'https://REPLACE_ME.supabase.co'
  SUPABASE_SERVICE_ROLE_KEY: 'REPLACE_ME'
