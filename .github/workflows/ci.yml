name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# None of these jobs write to the repository, open a PR, or push anything, so
# read-only is the correct default regardless of what the repository setting
# happens to be.
permissions:
  contents: read

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
